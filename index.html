  async v=>{ if (!v.gTarget) return "Informe o valor da meta"; const res = await applyActions([{op:"goal", name:v.gName||"Meta", target:v.gTarget, saved:v.gSaved, deadline:v.gDead}]); setTimeout(()=>done({title:"Meta criada", lines:res.lines, undo:res.undo})); });
}
function saveGoalSheet(id){
  const g = Store.items.get(id); if (!g) return;
  const pl = goalPlan(g);
  simpleSheet(`Guardar em ${esc(g.name)}`, [{id:"svAmt", label:"Valor (R$)", money:true, value: pl.perMonth? String(pl.perMonth.toFixed(2)).replace(".",","):"", ph:"0,00"}],
  async v=>{ if (!v.svAmt) return "Informe o valor"; const r = await saveToGoal(id, v.svAmt); if (r) setTimeout(()=>done({title:"Dinheiro guardado", lines:[r.line], undo:r.undo})); });
}
function limitSheet(cat){
  const lim = Store.profile().limits||{};
  simpleSheet(cat?`Limite de ${esc(cat)}`:"Novo limite mensal", [
    {id:"lCat", label:"Categoria", type:"select", options:OUT_CATS, value:cat||"Mercado"},
    {id:"lAmt", label:"Máximo por mês (R$) · deixe 0 para remover", money:true, value: cat&&lim[cat]?String(lim[cat]).replace(".",","):"", ph:"0,00"}],
  async v=>{ const res = await applyActions([{op:"limit", category:v.lCat, amount:v.lAmt}]); setTimeout(()=>done({title:v.lAmt?"Limite definido":"Limite removido", lines:res.lines, undo:res.undo})); });
}
function installHTML(){
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua), android = /Android/i.test(ua);
  const iosSteps = `<ol class="steps"><li>Abra o link do Bolso Claro no <b>Safari</b>.</li><li>Toque no botão <b>Compartilhar</b> (o quadrado com a seta para cima).</li><li>Escolha <b>Adicionar à Tela de Início</b> e confirme em <b>Adicionar</b>.</li></ol>`;
  const andSteps = `<ol class="steps"><li>Abra o link do Bolso Claro no <b>Chrome</b>.</li><li>Toque no menu <b>⋮</b> no canto superior direito.</li><li>Escolha <b>Adicionar à tela inicial</b> (ou <b>Instalar app</b>) e confirme.</li></ol>`;
  return `<div class="field"><h3>${ios?"No seu iPhone":android?"No seu Android":"No celular"}</h3></div>
    ${ios?iosSteps:android?andSteps:`<h3 style="font-size:.9rem">iPhone</h3>${iosSteps}<h3 style="font-size:.9rem">Android</h3>${andSteps}`}
    <p class="note">O ícone aparece junto com os outros aplicativos e abre direto no Bolso Claro. Seus dados ficam guardados neste celular, de forma privada. Os alertas de vencimento aparecem quando você abre o app.</p>
    ${ios||android?`<details><summary class="t-sub">Instruções para o outro sistema</summary>${ios?andSteps:iosSteps}</details>`:""}`;
}
function settingsSheet(){
  const p = Store.profile();
  openSheet(`<h2>Ajustes</h2>
    <div class="grid2"><div class="field"><label for="pSal">Salário líquido (R$)</label><input id="pSal" inputmode="decimal" value="${p.salary?String(p.salary).replace(".",","):""}" placeholder="0,00"></div>
    <div class="field"><label for="pDay">Cai todo dia</label><input id="pDay" inputmode="numeric" value="${p.payday||5}"></div></div>
    <div class="btns"><button class="btn primary" id="pSave">Salvar salário</button></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <h2>Contas e cartões</h2>
    <div class="list">${accounts().map(a=>`<div class="row" style="padding-block:8px">${badge(a)}<span class="grow t-title">${esc(a.name)}</span><button class="btn ghost" data-editacc="${a.id}">Editar</button></div>`).join("") || `<p class="help" style="margin:0">Nenhuma conta ainda.</p>`}</div>
    <div class="btns"><button class="btn" id="pAddAcc">+ Adicionar conta ou cartão</button></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <h2>Usar como aplicativo</h2>${installHTML()}
    <div class="btns"><button class="btn ghost" id="pClose">Fechar</button></div>`,
  (el, close)=>{
    el.querySelector("#pClose").onclick = close;
    el.querySelector("#pAddAcc").onclick = () => { close(); accountSheet(null); };
    el.querySelectorAll("[data-editacc]").forEach(b=>b.onclick=()=>{ close(); accountSheet(b.dataset.editacc); });
    el.querySelector("#pSave").onclick = async ()=>{ const res = await applyActions([{op:"profile", salary:parseMoney(el.querySelector("#pSal").value), payday:parseInt(el.querySelector("#pDay").value)||5}]); close(); done({title:"Salário salvo", lines:res.lines, undo:res.undo}); };
  });
}

// Confirmation pop-up shown after every registration; OK returns to the conversation
function done({title="Registrado com sucesso", lines=[], undo=[], chatId=null, kind="ok"} = {}){
  document.querySelectorAll(".scrim,.done-scrim").forEach(x=>x.remove());
  if (document.activeElement) document.activeElement.blur();
  const now = new Date();
  const icon = kind==="del" ? `<path d="M6 12h12"/>` : `<path d="M5 12.5l4.5 4.5L19 7.5"/>`;
  const wrap = document.createElement("div"); wrap.className = "done-scrim";
  wrap.innerHTML = `<div class="done ${kind==="del"?"del":""}" role="alertdialog" aria-modal="true" aria-labelledby="doneT">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></div>
    <h2 id="doneT">${esc(title)}</h2>
    <div class="when num">${now.toLocaleDateString("pt-BR",{day:"2-digit",month:"long"})} às ${now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</div>
    ${lines.length?`<div class="receipt num">${lines.map(l=>`<div class="${/limite|Atenção/i.test(l[0])&&!/^Limite (mensal|removido)/.test(l[0])?"warnline":""}"><span>${esc(l[0])}</span><b>${esc(l[1])}</b></div>`).join("")}</div>`:""}
    <button class="btn primary ok" id="doneOk">OK</button>
    ${undo.length?`<button class="undo2" id="doneUndo">Desfazer</button>`:""}
  </div>`;
  document.body.appendChild(wrap);
  const ok = wrap.querySelector("#doneOk"); ok.focus();
  const finish = () => { wrap.remove(); S.tab = "inicio"; render(); scrollFeed(); };
  ok.onclick = finish;
  wrap.addEventListener("keydown", e=>{ if (e.key==="Escape"||e.key==="Enter") { e.preventDefault(); finish(); } });
  const u = wrap.querySelector("#doneUndo");
  if (u) u.onclick = async () => {
    u.disabled = true; await undoAll(undo);
    const m = chatId && S.chat.find(x=>x.id===chatId); if (m) { m.undone = true; saveChat(); }
    finish(); toast("Registro desfeito");
  };
}

let toastT;
function toast(text){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent=text; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 2200);
}

// ---------- report helpers ----------
function reportText(){
  const md = monthData(S.month), ds = debtStats();
  const at = accTotals();
  const lines = [`Bolso Claro · ${monthName(S.month)}`, ...(at.accs.length?[`Dinheiro em contas hoje: ${fmt(at.money)}`, ...at.accs.map(a=>`- ${a.name}: ${a.type==="cartao"?"fatura "+fmt(Math.max(0,-at.b[a.id])):fmt(at.b[a.id])}`), ""]:[]), `Entradas: ${fmt(md.inc)}`, `Saídas: ${fmt(md.out)}`, `Saldo: ${fmt(md.bal)}`, "", "Gastos por categoria:"];
  Object.entries(md.byCat).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>lines.push(`- ${c}: ${fmt(v)}`));
  if (ds.debts.length) { lines.push("", `Dívidas abertas (${fmt(ds.remaining)} restantes):`); ds.debts.forEach(d=>lines.push(`- ${d.name}: ${d.paidCount}/${d.installments} × ${fmt(d.installmentValue)}`)); }
  if (S.aiText && S.aiMonth===S.month) lines.push("", "Análise:", S.aiText);
  return lines.join("\n");
}
async function runAI(){
  if (!S.sample || S.aiBusy) return;
  S.aiBusy = true; S.aiText = ""; S.aiMonth = S.month; render();
  const md = monthData(S.month), p = Store.profile(), ds = debtStats();
  const prev = monthData(shiftMonth(S.month,-1));
  const prompt = `Você é um consultor financeiro pessoal brasileiro, direto e acolhedor. Analise o mês ${monthName(S.month)} deste usuário.
Dinheiro em contas hoje: ${accTotals().money.toFixed(2)}; faturas de cartão em aberto: ${accTotals().cards.toFixed(2)}.
Salário fixo: ${p.salary||"não informado"}. Entradas: ${md.inc.toFixed(2)}. Saídas: ${md.out.toFixed(2)}. Saldo: ${md.bal.toFixed(2)}.
Mês anterior: entradas ${prev.inc.toFixed(2)}, saídas ${prev.out.toFixed(2)}.
Gastos por categoria: ${Object.entries(md.byCat).map(([c,v])=>`${c} ${v.toFixed(2)}`).join("; ")||"nenhum"}.
Dívidas abertas: ${ds.debts.map(d=>`${d.name}: parcela ${d.installmentValue}, ${d.installments-d.paidCount} restantes`).join("; ")||"nenhuma"} (total mensal ${ds.monthly.toFixed(2)}).
Contas fixas: ${billStats().bills.map(b=>`${b.name} ${b.amount}`).join("; ")||"nenhuma"}.
Metas: ${Store.all("goal").map(g=>`${g.name}: ${g.saved||0} de ${g.target}${g.deadline?" até "+g.deadline:""}`).join("; ")||"nenhuma"}.
Limites: ${Object.entries(p.limits||{}).map(([c,v])=>`${c} ${v} (usado ${(md.byCat[c]||0).toFixed(2)})`).join("; ")||"nenhum"}.
Escreva em português, texto simples sem markdown nem asteriscos, até 170 palavras, com:
1) Diagnóstico em 2 frases (use os números em R$).
2) "Pontos de atenção:" até 2 itens curtos começando com "- ".
3) "Para o próximo mês:" 3 ações práticas e específicas começando com "- ", incluindo um valor-alvo de economia.
Se houver dívidas, diga qual priorizar e por quê. Se houver metas, diga se o ritmo está certo; se não houver reserva de emergência, sugira começar uma.`;
  try {
    await S.sample(prompt, {modelTier:"default", onText:({text})=>{ S.aiText=text; const el=document.querySelector(".ai"); if (el) el.textContent=text; else render(); }});
  } catch (e) {
    S.aiText = e && e.code==="not_granted" ? "Análise não autorizada. Você pode permitir no menu de permissões do app." : "Não consegui gerar a análise agora. Tente de novo em instantes.";
  }
  S.aiBusy = false; render();
}
async function exportCSV(){
  const rows = [["data","tipo","categoria","descricao","pagamento","conta","valor"]];
  const tipo = {in:"entrada", out:"saida", transfer:"transferencia", adjust:"ajuste"};
  Store.all("tx").sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date, tipo[t.type]||t.type, t.category, t.desc, t.method||"",
    t.type==="transfer" ? `${accName(t.fromId)} -> ${accName(t.toId)}` : (accounts().length ? accName(accOf(t)) : ""),
    String((t.type==="out"?-1:1)*t.amount).replace(".",",")]));
  const csv = "﻿" + rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
  try { await S.downloads.save({filename:`bolso-claro-${todayStr()}.csv`, data:new Blob([csv],{type:"text/csv"})}); toast("Planilha pronta"); }
  catch (e) { toast("Download cancelado"); }
}

// ---------- events ----------
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); window.scrollTo({top:0}); });
document.getElementById("openSettings").onclick = settingsSheet;
document.body.addEventListener("click", e=>{
  const b = e.target.closest(".sheet [data-edit], .sheet [data-move]"); if (!b) return;
  setTimeout(()=> b.dataset.edit ? txSheet(b.dataset.edit) : moveSheet(b.dataset.move));
});
document.getElementById("mPrev").onclick = ()=>{ S.month = shiftMonth(S.month,-1); render(); };
document.getElementById("mNext").onclick = ()=>{ S.month = shiftMonth(S.month,1); render(); };
const input = document.getElementById("chatInput");
input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(120,input.scrollHeight)+"px"; });
input.addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("chatForm").requestSubmit(); } });
document.getElementById("chatForm").addEventListener("submit", e=>{ e.preventDefault(); const v=input.value; input.value=""; input.style.height="auto"; sendMessage(v); });
view.addEventListener("click", async e=>{
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.ex) { input.value = t.dataset.ex; input.focus(); return; }
  if (t.id==="clearChat") { S.chat=[]; saveChat(); render(); return; }
  if (t.dataset.undo) { const m=S.chat.find(x=>x.id===t.dataset.undo); if (m && !m.undone) { await undoAll(m.undo); m.undone=true; saveChat(); render(); toast("Registro desfeito"); } return; }
  if (t.dataset.edit) { txSheet(t.dataset.edit); return; }
  if (t.id==="addTx") { txSheet(null); return; }
  if (t.id==="addDebt") { debtSheet(); return; }
  if (t.id==="addBill") { billSheet(); return; }
  if (t.id==="addAcc") { accountSheet(null); return; }
  if (t.id==="feedback") { try { const r = await S.comments.openComposer({element: t}); if (r && r.opened===false) toast("Toque de novo para escrever sua opinião"); } catch { toast("Não foi possível abrir agora"); } return; }
  if (t.dataset.acc) { accountDetail(t.dataset.acc); return; }
  if (t.id==="openTransfer") { transferSheet(); return; }
  if (t.dataset.paycard) { const v = balances()[t.dataset.paycard]||0; transferSheet({toId:t.dataset.paycard, amount:Math.max(0,-v)}); return; }
  if (t.dataset.move) { moveSheet(t.dataset.move); return; }
  if (t.id==="openSettings2") { settingsSheet(); return; }
  if (t.id==="hideOnb") { lsSet("bolso.onb.hide", true); render(); return; }
  if (t.id==="addGoal") { goalSheet(); return; }
  if (t.id==="addLimit") { limitSheet(null); return; }
  if (t.id==="installTip") { settingsSheet(); return; }
  if (t.dataset.editlimit) { limitSheet(t.dataset.editlimit); return; }
  if (t.dataset.savegoal) { saveGoalSheet(t.dataset.savegoal); return; }
  if (t.dataset.paybill) { const r = await payBill(t.dataset.paybill); if (r) done({title:"Pagamento registrado", lines:[r.line], undo:r.undo}); return; }
  if (t.dataset.delbill) { if (t.dataset.confirm) { const id=t.dataset.delbill, prev=Store.items.get(id); await Store.del(id); done({title:"Conta fixa excluída", kind:"del", lines:[[prev.name, fmt(prev.amount)]], undo:[{id, prev}]}); } else { t.dataset.confirm=1; t.textContent="Excluir?"; } return; }
  if (t.dataset.delgoal) { if (t.dataset.confirm) { const id=t.dataset.delgoal, prev=Store.items.get(id); await Store.del(id); done({title:"Meta excluída", kind:"del", lines:[[prev.name, fmt(prev.target)]], undo:[{id, prev}]}); } else { t.dataset.confirm=1; t.textContent="Confirmar exclusão"; } return; }
  if (t.dataset.pay) { const r = await payDebt(t.dataset.pay, 1); if (r) done({title:"Pagamento registrado", lines:[r.line], undo:r.undo}); return; }
  if (t.dataset.deldebt) { if (t.dataset.confirm) { const id=t.dataset.deldebt, prev=Store.items.get(id); await Store.del(id); done({title:"Dívida excluída", kind:"del", lines:[[prev.name, fmt(prev.total)]], undo:[{id, prev}]}); } else { t.dataset.confirm=1; t.textContent="Confirmar exclusão"; } return; }
  if (t.id==="aiBtn") { runAI(); return; }
  if (t.id==="csv") { exportCSV(); return; }
  if (t.id==="copyRep") { const txt = reportText(); try { await navigator.clipboard.writeText(txt); toast("Relatório copiado"); } catch { toast("Não foi possível copiar"); } return; }
});

Store.listeners.push(render);
render();
Store.init();
if (window.claude && claude.use) {
  claude.use("sample").then(s=>{ S.sample = s; render(); }).catch(()=>{});
  claude.use("downloads").then(d=>{ S.downloads = d; render(); }).catch(()=>{});
  claude.use("comments").then(c=>{ S.comments = c; render(); }).catch(()=>{});
}
})();
</script>
